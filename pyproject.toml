[build-system]
requires = ["setuptools>=68.2"]
build-backend = "setuptools.build_meta"

[project]
name = "haiqu-sdk"
description = "Python SDK for Haiqu quantum cloud — circuit analytics, error mitigation, and hybrid quantum application execution"
authors = [{name = "Haiqu, Inc.", email = "info@haiqu.ai"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "quantum computing",
    "error mitigation",
    "zero-noise extrapolation",
    "hybrid quantum-classical",
    "quantum applications",
    "quantum machine learning",
    "QML",
    "data loading",
    "qiskit",
    "circuit analytics",
    "quantum cloud",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "beartype==0.22.9",
    "numpy>=2,<3",
    "openqasm3[parser]>=1,<2",
    "pydantic>=2.6.0,<3.0",
    "requests>=2.33.0,<3",
    "scipy>=1.14,<2",
    "sympy>=1.13,<2",
    "urllib3>=1.26,<3",

    "qiskit>=2.5.2,<2.6",
    "qiskit_ibm_runtime==0.48.*",
    "qiskit-aer==0.17.*",
    "qiskit_algorithms==0.4.0",
    "qiskit-addon-obp==0.3.0",
    "qiskit-addon-utils==0.3.0",
    "qiskit-addon-opt-mapper==0.1.0",
    "qiskit-qasm3-import==0.6.0",
    "qiskit-optimization[cplex]==0.7.0",  # LP serialization for the quadratic kernel adapter

    "cplex",  # qiskit-optimization==0.7.0 ignores [cplex] for python>=3.13

    "tabulate==0.9.0",
    "plotly==6.0.0",
    "kaleido==0.2.1",
    "pandas==2.3.*",
    "ipywidgets==8.1.8",
]

dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown; charset=UTF-8"

[project.urls]
Homepage = "https://haiqu.ai"
Documentation = "https://docs.haiqu.ai"
Source = "https://github.com/haiqu-ai/haiqu-sdk"
"Bug Tracker" = "https://github.com/haiqu-ai/haiqu-sdk/-/issues"

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.9,<4",
    "networkx>=3.4,<4",
    "pylatexenc>=2.10,<3",
]
skqd = [
    "ffsim",
]
dev = [
    "black==23.7.0",
    "isort",
    "flake8==7.2.0",
]
build = [
    
]

[tool.setuptools.packages.find]
include = ["haiqu*"]

[tool.setuptools.dynamic]
version = {attr = "haiqu.sdk.version.__version__"}

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.black]
line-length = 130

[tool.isort]
line_length = 130
profile = "black"
multi_line_output = 3

[tool.mypy]
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

ignore_missing_imports = true

[tool.coverage.run]
source = ['haiqu']
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 100
skip_covered = true
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "def __str__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
